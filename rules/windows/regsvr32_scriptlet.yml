id: DF-WIN-004
title: Regsvr32 remote scriptlet execution
description: Regsvr32 command-line arguments indicate Squiblydoo-style proxy execution or a remote scriptlet.
type: event
sources: [windows, sysmon]
severity: high
match:
  conditions:
    action: process_created
    details.process_name:
      contains: regsvr32
    details.command_line:
      contains_any: ['scrobj.dll', '/i:http', '/i:https']
attack:
  id: T1218.010
  name: Regsvr32
  tactic: Defense Evasion
  url: https://attack.mitre.org/techniques/T1218/010/
remediation: Isolate the host, capture referenced scriptlets and URLs, and investigate the initiating process and user session.
false_positives: Rare administrative component registration using remote resources.

