id: DF-WIN-005
title: Suspicious Rundll32 proxy execution
description: Rundll32 was launched with a URL, JavaScript handler, or unusual script-oriented argument.
type: event
sources: [windows, sysmon]
severity: high
match:
  conditions:
    action: process_created
    details.process_name:
      contains: rundll32
    details.command_line:
      contains_any: ['javascript:', 'http://', 'https://', 'mshtml,']
attack:
  id: T1218.011
  name: Rundll32
  tactic: Defense Evasion
  url: https://attack.mitre.org/techniques/T1218/011/
remediation: Isolate the host, inspect the referenced DLL or URL, and review the full process tree and related network connections.
false_positives: Legacy applications invoking Control Panel or vendor DLL functions.

