id: DF-SYSMON-001
title: Possible LSASS credential dumping
description: A suspicious process command line references LSASS or common credential-dumping behavior.
type: event
source: sysmon
severity: critical
match:
  source: sysmon
  conditions:
    action: process_created
    details.command_line:
      contains_any: [lsass, sekurlsa, comsvcs.dll]
attack:
  id: T1003.001
  name: LSASS Memory
  tactic: Credential Access
  url: https://attack.mitre.org/techniques/T1003/001/
remediation: Isolate the endpoint, preserve volatile evidence, rotate exposed credentials, and investigate lateral movement from the host.

